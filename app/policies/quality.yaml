# Umbrales de la compuerta de calidad (Tier 3).
# Editar aquí bloquea/desbloquea el release; el historial de cambios de este
# archivo se versiona junto con el dataset (ver pantalla "Settings").

min_images_per_class:
  # Gate M3 del proyecto: al menos 300 imágenes por clase, en al menos 2 clases.
  threshold: 300
  action: fail

max_imbalance_ratio:
  # Clase más grande / clase más chica.
  threshold: 20.0
  action: warn

max_small_object_ratio:
  # Proporción de cajas con lado menor a 32x32 px.
  threshold: 0.40
  action: warn

degenerate_boxes:
  # Cajas con ancho/alto <= 0, o que se salen de la imagen.
  threshold: 0
  action: fail

cross_split_leakage:
  # Pares casi-duplicados (pHash) repartidos entre splits distintos.
  threshold: 0
  action: fail

duplicate_similarity_threshold:
  # Distancia pHash a partir de la cual dos imágenes se consideran duplicadas.
  threshold: 0.94
  action: warn
